name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check bootstrap shell syntax
        run: sh -n scripts/bootstrap.sh
      - name: Check JSON schema syntax
        run: python3 -m json.tool schema/appliance.schema.json >/dev/null
      - name: Check whitespace
        run: git diff --check HEAD^
