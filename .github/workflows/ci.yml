name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install test dependencies
        run: python3 -m pip install --break-system-packages PyYAML jsonschema
      - name: Check shell syntax
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/install.sh
          sh -n dietpi/Automation_Custom_Script.sh
          sh -n bin/ploos-appliance
          sh -n lib/agent
          sh -n test-workload/workload.sh
          sh -n tests/test-host.sh
          sh -n tests/test-oci-runtime.sh
      - name: Check Python syntax
        run: python3 -m py_compile lib/validate-manifest.py
      - name: Check JSON schema syntax
        run: python3 -m json.tool schema/appliance.schema.json >/dev/null
      - name: Run host lifecycle tests
        run: sh tests/test-host.sh
      - name: Qualify real Docker lifecycle
        run: sh tests/test-oci-runtime.sh docker
      - name: Check whitespace
        run: git diff --check HEAD^
